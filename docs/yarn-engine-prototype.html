 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto}

<div class="wrap">
  <div class="eyebrow">YARN ENGINE · PROTOTYPE</div>
  <h1>실 한 가닥 엔진 시안</h1>
  <p class="lead">그림이나 사진이 아니라, 실이 지나가는 길에 꼬인 실을 입혀서 그린 화면입니다. 끌어서 돌리고, 오른쪽에서 재질을 바꿔 보세요. “도안 → 3D”는 단별 코 수만으로 완성 모양을 계산합니다.</p>
  <div class="main">
    <div class="stage">
      <canvas id="cv" aria-label="실 3D 미리 보기"></canvas>
      <div class="tabs" role="group" aria-label="보기">
        <button class="tab" data-scene="knit" aria-pressed="true">대바늘 메리야스</button>
        <button class="tab" data-scene="chain" aria-pressed="false">코바늘 사슬</button>
        <button class="tab" data-scene="strand" aria-pressed="false">실 한 가닥</button>
        <button class="tab" data-scene="item" aria-pressed="false">도안 → 3D</button>
      </div>
      <div class="hint">끌기 = 돌리기 · 휠/두 손가락 = 확대</div>
    </div>
    <div class="panel">
      <div id="itemBox" hidden><h2>도안</h2><div class="chips" id="kinds">
        <button class="chip" data-k="coaster" aria-pressed="true">코스터</button>
        <button class="chip" data-k="bag" aria-pressed="false">손가방</button></div>
        <div id="bagOpts" hidden><h2 style="margin-top:12px">가방 모양</h2><div class="chips" id="shapes">
          <button class="chip" data-s="cyl" aria-pressed="true">원통</button><button class="chip" data-s="tote" aria-pressed="false">위가 넓게</button><button class="chip" data-s="pouch" aria-pressed="false">복주머니</button></div>
          <h2 style="margin-top:12px">끈</h2><div class="chips" id="straps">
          <button class="chip" data-t="none" aria-pressed="true">없음</button><button class="chip" data-t="two" aria-pressed="false">손잡이 2개</button><button class="chip" data-t="long" aria-pressed="false">어깨끈</button></div></div>
        <label style="margin-top:12px">늘림<input id="s-inc" type="range" min="4" max="8" step="1" value="6"><output id="o-inc">6</output></label>
        <p id="verdict" class="verdict"></p>
        <label>실 굵기<input id="s-ymm" type="range" min="1.5" max="6" step="0.5" value="3"><output id="o-ymm">3mm</output></label>
        <label>바늘<input id="s-hmm" type="range" min="2" max="8" step="0.5" value="3"><output id="o-hmm">3mm</output></label>
        <p id="sizeinfo" class="verdict"></p>

        <div class="chips" id="colors2" hidden style="margin-bottom:10px"></div>
        <div class="chips" id="views"><button class="chip" data-v="yarn" aria-pressed="true">실로 보기</button><button class="chip" data-v="holo" aria-pressed="false">구조로 보기</button></div>
      </div>
      <div><h2>재질</h2><div class="chips" id="presets">
        <button class="chip" data-p="cotton" aria-pressed="true">면</button>
        <button class="chip" data-p="wool" aria-pressed="false">울</button>
        <button class="chip" data-p="mohair" aria-pressed="false">모헤어</button>
        <button class="chip" data-p="cord" aria-pressed="false">코드사</button>
        <button class="chip" data-p="fur" aria-pressed="false">털실</button>
        <button class="chip" data-p="metal" aria-pressed="false">메탈릭</button>
      </div></div>
      <div><h2>색</h2><div class="chips" id="colors"></div></div>
      <div><h2>실 만들기</h2>
        <label>굵기<input id="s-thick" type="range" min="0.6" max="1.4" step="0.05" value="1"><output id="o-thick">1.0</output></label>

        <label>꼬임<input id="s-twist" type="range" min="0" max="2" step="0.1" value="1"><output id="o-twist">1.0</output></label>
        <label>보풀<input id="s-fuzz" type="range" min="0" max="1" step="0.05" value="0.05"><output id="o-fuzz">0.05</output></label>
      </div>
      <button class="play" id="play">뜨는 순서 보기</button>
      <p class="note"><b>이 시안이 보여 주는 것</b><br>코 모양은 실의 길(곡선)로만 저장하고, 가닥·꼬임·보풀은 그리는 순간에 만듭니다. 같은 길에 다른 실을 입히면 재질이 바뀝니다.</p>
    </div>
  </div>
</div>

<script>
(function(){
const cv=document.getElementById('cv');

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){cv.outerHTML='<div class="err">이 기기에서는 3D(WebGL)를 쓸 수 없습니다.</div>';return}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.NoToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const cam=new THREE.PerspectiveCamera(32,1,0.1,200);cam.position.set(0,0,17);

// 빛은 오른쪽 위에서 → 그림자는 왼쪽 아래
scene.add(new THREE.HemisphereLight(0xfffaf2,0xd8c4a8,0.78));
const sun=new THREE.DirectionalLight(0xfff6ea,0.95);sun.position.set(7,9,10);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-10;sc.right=10;sc.top=10;sc.bottom=-10;sc.near=1;sc.far=40;sun.shadow.bias=-0.0006;sun.shadow.radius=4;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xf2e9df,0.16);fill.position.set(-8,-2,6);scene.add(fill);
const back=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.ShadowMaterial({color:0x5a4632,opacity:.2}));back.position.z=-1.1;back.receiveShadow=true;scene.add(back);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.ShadowMaterial({color:0x5a4632,opacity:.2}));ground.rotation.x=-Math.PI/2;ground.position.y=-.3;ground.receiveShadow=true;ground.visible=false;scene.add(ground);
const group=new THREE.Group();scene.add(group);
const ENV=(function(){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#fffdf6');g.addColorStop(.38,'#cdbfa8');g.addColorStop(.52,'#4a4038');g.addColorStop(.7,'#8c7a66');g.addColorStop(1,'#2e2823');x.fillStyle=g;x.fillRect(0,0,256,128);
  [[190,26,26],[60,40,16],[120,18,12]].forEach(([a,b,r])=>{const q=x.createRadialGradient(a,b,0,a,b,r);q.addColorStop(0,'rgba(255,255,255,1)');q.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=q;x.fillRect(a-r,b-r,r*2,r*2)});
  const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;const pm=new THREE.PMREMGenerator(renderer);const e=pm.fromEquirectangular(t).texture;pm.dispose();return e})();
function yarnMat(R){return new THREE.MeshStandardMaterial({vertexColors:true,roughness:st.rough,metalness:st.metal,envMap:st.metal?ENV:null,envMapIntensity:1.25,bumpMap:FTEX,bumpScale:R*.05})}

// ---------- 섬유 결 텍스처 (실 길이 방향 줄무늬)
function fiberTex(){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='#808080';x.fillRect(0,0,256,64);
  for(let i=0;i<420;i++){const y=Math.random()*64,l=30+Math.random()*120,x0=Math.random()*256,g=100+Math.random()*90|0;x.strokeStyle='rgba('+g+','+g+','+g+',.5)';x.lineWidth=.6+Math.random();x.beginPath();x.moveTo(x0,y);x.lineTo(x0+l,y+(Math.random()-.5)*3);x.stroke();if(x0+l>256){x.beginPath();x.moveTo(x0-256,y);x.lineTo(x0+l-256,y);x.stroke()}}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const FTEX=fiberTex();

// ---------- 실 만들기: 중심선(points) → 꼬인 가닥 표면
const st={preset:'cotton',thick:1,plies:4,twist:1,fuzz:.05,depth:.3,braid:false,rough:.82,metal:0,fur:false,color:'#EFE6D4',color2:'#D9A9A6',scene:'knit'};
function buildYarn(pts,R,o){o=o||{};
  const n=pts.length,M=o.M||Math.max(14,st.plies*6),N=o.M?Math.min(st.plies,Math.floor(o.M/4)):st.plies,tau=st.twist*0.75/R,K=3;
  const pos=new Float32Array(n*(M+1)*3),col=new Float32Array(n*(M+1)*3),uv=new Float32Array(n*(M+1)*2),frames=[];
  const T=new THREE.Vector3(),Nv=new THREE.Vector3(),B=new THREE.Vector3(),tmp=new THREE.Vector3();
  let s=0;const base=new THREE.Color(o.color||st.color).convertSRGBToLinear();
  for(let i=0;i<n;i++){
    T.copy(pts[Math.min(n-1,i+1)]).sub(pts[Math.max(0,i-1)]).normalize();
    if(i===0){Nv.set(0,0,1);if(Math.abs(T.z)>.9)Nv.set(0,1,0)}
    Nv.sub(tmp.copy(T).multiplyScalar(Nv.dot(T))).normalize();B.crossVectors(T,Nv);
    if(i>0)s+=pts[i].distanceTo(pts[i-1]);
    frames.push({p:pts[i],t:T.clone(),n:Nv.clone(),b:B.clone(),s});
    for(let j=0;j<=M;j++){const ph=j/M*Math.PI*2;let f;
      if(st.braid){const a=.5+.5*Math.cos(N*(ph-tau*s)),b=.5+.5*Math.cos(N*(ph+tau*s));f=Math.max(a,b)*.75+.25*(a*b)}
      else f=N<=1?1:Math.pow(Math.abs(Math.cos(N/2*(ph-tau*s))),.55);
      const e=o.closed?1:Math.min(1,Math.sqrt(1-Math.pow(1-Math.min(i,n-1-i,K)/K,2))+.02);const r=R*(1-st.depth+st.depth*f)*e,k=(i*(M+1)+j);
      const cx=Math.cos(ph)*r,sx=Math.sin(ph)*r;
      pos[k*3]=pts[i].x+Nv.x*cx+B.x*sx;pos[k*3+1]=pts[i].y+Nv.y*cx+B.y*sx;pos[k*3+2]=pts[i].z+Nv.z*cx+B.z*sx;
      const sh=.55+.45*f;col[k*3]=base.r*sh;col[k*3+1]=base.g*sh;col[k*3+2]=base.b*sh;
      uv[k*2]=s/(R*7);uv[k*2+1]=j/M*Math.max(1,N)-tau*s/(Math.PI*2)*Math.max(1,N)*(st.braid?0:1);
    }}
  const idx=[];for(let i=0;i<n-1;i++)for(let j=0;j<M;j++){const a=i*(M+1)+j,b=a+M+1;idx.push(a,b,a+1,b,b+1,a+1)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  g.userData={frames,R,perRing:M*6,color:o.color||st.color};return g}
function fuzzLines(geos){
  if(st.fuzz<=0.01)return null;const v=[],col=[],cc=new THREE.Color(),WH=new THREE.Color('#ffffff');const d=new THREE.Vector3(),p=new THREE.Vector3();
  geos.forEach(g=>{const fr=g.userData.frames,R=g.userData.R,len=fr[fr.length-1].s,count=Math.floor(len/R*st.fuzz*(st.fur?46:26));
    for(let k=0;k<count;k++){const f=fr[Math.random()*fr.length|0],ph=Math.random()*6.283,c=Math.cos(ph),s=Math.sin(ph);
      d.set(0,0,0).addScaledVector(f.n,c).addScaledVector(f.b,s);p.copy(f.p).addScaledVector(d,R*.8);
      const L=R*(.25+Math.random()*Math.random()*2.2)*(.35+st.fuzz)*(st.fur?3.4:1);d.addScaledVector(f.t,(Math.random()-.5)*1.6).add(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(.5)).normalize();
      v.push(p.x,p.y,p.z,p.x+d.x*L,p.y+d.y*L,p.z+d.z*L);const br=st.fur?.5+Math.random()*.5:1,k0=st.fur?.5:.9;cc.set(g.userData.color||st.color);if(st.fur)cc.convertSRGBToLinear();else cc.lerp(WH,.35);col.push(cc.r*br*k0,cc.g*br*k0,cc.b*br*k0,cc.r*br,cc.g*br,cc.b*br)}});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:st.fur?.6:.22,depthWrite:false}))}

// ---------- 코의 길 (중심선)
function resample(curve,R){const n=Math.max(40,Math.ceil(curve.getLength()/(R*.42)));return curve.getSpacedPoints(n)}
function knitRows(R){ // 메리야스: 한 단 = 실 한 줄
  const cols=8,rows=9,w=1.12,rh=.7,H=1.18,a=.25,d=R*1.0,out=[];
  for(let j=0;j<rows;j++){const pts=[],per=26;
    for(let i=-Math.round(per*.25);i<=cols*per+Math.round(per*.25);i++){const u=i/per;
      pts.push(new THREE.Vector3(w*u+a*Math.sin(4*Math.PI*u)-cols*w/2,(j-(rows-1)/2)*rh-(H/2)*Math.cos(2*Math.PI*u),-d*Math.cos(4*Math.PI*u)))}

function chainPath(R){ // 사슬: 고리 속으로 다음 고리가 빠져나옴 (V 두 가닥 + 뒤 산)

    cp.push(new THREE.Vector3(x,0,0),

      new THREE.Vector3(x+.98*L,-wy*.62,zf*.4),new THREE.Vector3(x+.42*L,-wy,zf),
      new THREE.Vector3(x+.12*L,-wy*.45,-zb*.45),new THREE.Vector3(x+.5*L,0,-zb))}

const IT={kind:'coaster',inc:6,view:'yarn',data:null,shape:'cyl',strap:'none',ymm:3,hmm:3,stripe:false};const MM=12;
function makeItem(){

  else{for(let r=1;r<=7;r++)counts.push(IT.inc*r);let c=IT.inc*7;for(let r=0;r<12;r++){const h3=Math.round(IT.inc/3),h2=Math.round(IT.inc/2);if(IT.shape==='tote'&&r>0)c+=h3;if(IT.shape==='pouch'){if(r>=1&&r<=4)c+=h2;else if(r>=7)c-=h2}counts.push(c)}}
  const P=[new THREE.Vector3(0,0,0)],start=[],E=[];let rho=0,y=0,A=0;
  counts.forEach((c,r)=>{start.push(P.length);const cr=c*sw/(2*Math.PI);let amp=0;
    if(cr<=rho+rh){const dr=Math.max(-rh*.98,cr-rho);y+=Math.sqrt(Math.max(0,rh*rh-dr*dr));rho=Math.max(.05,cr)}
    else{rho+=rh;const q=c*sw/(2*Math.PI*rho);amp=rho/6*Math.sqrt(Math.max(0,2*(q*q-1)))}
    for(let i=0;i<c;i++){const th=(i+.5)/c*2*Math.PI;P.push(new THREE.Vector3(Math.cos(th)*rho,y+amp*Math.sin(6*th)+(Math.random()-.5)*.01,Math.sin(th)*rho))}
    const s0=start[r];
    for(let i=0;i<c;i++){E.push([s0+i,s0+(i+1)%c,sw,1]);if(c>=6)E.push([s0+i,s0+(i+2)%c,2*cr*Math.sin(2*Math.PI/c),.3])}
    if(r===0){for(let i=0;i<c;i++)E.push([s0+i,0,Math.max(cr,.2),1])}
    else{const pc=counts[r-1],ps=start[r-1];for(let i=0;i<c;i++){const f=(i+.5)/c*pc,p=Math.floor(f),fr=f-p-.5,q=fr>=0?p+1:p-1;
      E.push([s0+i,ps+((p%pc)+pc)%pc,Math.hypot(rh,fr*sw),1]);E.push([s0+i,ps+((q%pc)+pc)%pc,Math.hypot(rh,(1-Math.abs(fr))*sw),.35])}}
  });
  return {P,E,counts,start,rh,sw,iter:0,done:false}}
function relax(D,passes){const d=new THREE.Vector3();
  for(let k=0;k<passes;k++)for(let e=0;e<D.E.length;e++){const ed=D.E[e],a=D.P[ed[0]],b=D.P[ed[1]];d.subVectors(b,a);const len=d.length()||1e-6,c=(len-ed[2])/len*.5*ed[3];a.addScaledVector(d,c);b.addScaledVector(d,-c)}
  const o=D.P[0].clone();D.P.forEach(p=>{p.x-=o.x;p.z-=o.z});
  let miny=1e9;D.P.forEach(p=>{if(p.y<miny)miny=p.y});D.P.forEach(p=>p.y-=miny)}
let holo=null;
function buildHolo(D){const n=D.P.length,pos=new Float32Array(n*3);const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const ring=[],vert=[];D.E.forEach(e=>{if(e[3]===1){(e[2]===D.sw?ring:vert).push(e[0],e[1])}});
  const mk=(idx,color,op)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',pg.getAttribute('position'));g.setIndex(idx);return new THREE.LineSegments(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}))};
  const last=D.start[D.start.length-1],hi=[];for(let i=0;i<D.counts[D.counts.length-1];i++)hi.push(last+i,last+(i+1)%D.counts[D.counts.length-1]);
  const g=new THREE.Group();g.add(mk(vert,0xb99447,.28),mk(ring,0xb08a3e,.9),mk(hi,0xc0787e,1),new THREE.Points(pg,new THREE.PointsMaterial({color:0xa8823a,size:.11,sizeAttenuation:true})));
  g.userData.pos=pg.getAttribute('position');return g}
function updateHolo(D){const a=holo.userData.pos;for(let i=0;i<D.P.length;i++)a.setXYZ(i,D.P[i].x,D.P[i].y,D.P[i].z);a.needsUpdate=true}
function buildItemYarn(D){const R=IT.ymm/2/MM*st.thick*(st.preset==='mohair'?.8:1),geos=[];
  const mat=yarnMat(R);
  D.counts.forEach((c,r)=>{const s0=D.start[r],tops=[],saw=[];
    for(let i=0;i<c;i++){const top=D.P[s0+i];let bot;
      if(r===0)bot=D.P[0].clone().lerp(top,.25);
      else{const pc=D.counts[r-1],ps=D.start[r-1],fb=(i+1)/c*pc-.5,pb=Math.floor(fb),t=fb-pb;bot=D.P[ps+((pb%pc)+pc)%pc].clone().lerp(D.P[ps+(((pb+1)%pc)+pc)%pc],t)}
      tops.push(top.clone());saw.push(top.clone(),bot)}
    [saw,tops].forEach((arr,ix)=>{if(arr.length<3)return;const cv=new THREE.CatmullRomCurve3(arr,true,'catmullrom',.5),Rr=ix?R*.9:R;
      const pts=cv.getSpacedPoints(Math.max(24,Math.ceil(cv.getLength()/(Rr*.75))));const g=buildYarn(pts,Rr,{M:10,closed:true,color:IT.stripe&&(Math.floor(r/2)%2)?st.color2:st.color}),m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;group.add(m);meshes.push(m);geos.push(g)})});
  if(IT.kind==='bag'&&IT.strap!=='none'){const c=D.counts[D.counts.length-1],s0=D.start[D.start.length-1];let ry=0,rr=0;for(let i=0;i<c;i++){const q=D.P[s0+i];ry+=q.y;rr+=Math.hypot(q.x,q.z)}ry/=c;rr/=c;
    const arcs=IT.strap==='long'?[[0,Math.PI,rr*2.3,0]]:[[Math.PI/2-.62,Math.PI/2+.62,rr*1.25,1],[-Math.PI/2-.62,-Math.PI/2+.62,rr*1.25,-1]];
    arcs.forEach(([a,b,H,side])=>{const A=new THREE.Vector3(Math.cos(a)*rr,ry,Math.sin(a)*rr),B=new THREE.Vector3(Math.cos(b)*rr,ry,Math.sin(b)*rr),w=new THREE.Vector3().subVectors(B,A).normalize(),nrm=new THREE.Vector3(-w.z,0,w.x);
      [-1,0,1].forEach(k=>{const pts=[];for(let i=0;i<=40;i++){const t=i/40,q=A.clone().lerp(B,t);q.y+=H*Math.sin(Math.PI*t)-R*1.2*(1-Math.sin(Math.PI*t));q.addScaledVector(nrm,k*R*1.75+side*rr*.12*Math.sin(Math.PI*t));pts.push(q)}
        const cv=new THREE.CatmullRomCurve3(pts),g=buildYarn(cv.getSpacedPoints(Math.ceil(cv.getLength()/(R*.6))),R,{M:10}),m=new THREE.Mesh(g,mat);m.castShadow=true;group.add(m);meshes.push(m);geos.push(g)})})}
  fz=fuzzLines(geos);if(fz)group.add(fz)}
function sizeInfo(D){let my=0,mr=0;D.P.forEach(q=>{if(q.y>my)my=q.y;const r=Math.hypot(q.x,q.z);if(r>mr)mr=r});const cm=v=>(v*MM/10).toFixed(1),k=IT.hmm/IT.ymm;
  const fit=k<.8?'바늘이 가늘어서 빡빡하고 단단한 편물이 됩니다.':k>1.45?'바늘이 굵어서 성글고 부드러운 편물이 됩니다.':'실과 바늘이 잘 맞습니다.';
  document.getElementById('sizeinfo').textContent='완성 크기 약 지름 '+cm(mr*2)+'cm'+(my>D.rh*2?' · 높이 '+cm(my)+'cm':'')+' — '+fit;return {my,mr}}
function showItem(){const D=IT.data;meshes.forEach(m=>m.geometry.dispose());meshes=[];while(group.children.length)group.remove(group.children[0]);fz=null;
  if(IT.view==='yarn'&&D.done)buildItemYarn(D);else{holo=buildHolo(D);updateHolo(D);group.add(holo)}}
function startItem(){document.getElementById('bagOpts').hidden=IT.kind!=='bag';document.getElementById('sizeinfo').textContent='모양을 계산하는 중입니다…';IT.data=makeItem();holo=null;showItem();
  const v=IT.inc<6?'늘림이 부족해서 가장자리가 위로 솟습니다 (컵처럼 말림).':IT.inc>6?'늘림이 많아서 가장자리가 물결칩니다.':'한 단에 6코씩 늘리면 평평하게 떠집니다.';document.getElementById('verdict').textContent='한 단에 '+IT.inc+'코 늘림 — '+v}
function tickItem(){const D=IT.data;if(!D||D.done)return;relax(D,8);D.iter++;if(holo&&holo.parent)updateHolo(D);
  if(D.iter>=(matchMedia('(prefers-reduced-motion: reduce)').matches?1:150)){if(D.iter<150)relax(D,900);D.done=true;const z=sizeInfo(D),sh=IT.kind==='bag'?(IT.strap==='two'?z.mr*1.25:IT.strap==='long'?z.mr*2.3:0):0,tot=z.my+sh,ext=Math.max(z.mr*2,tot),dir=cam.position.clone().sub(ctl.target).normalize();ctl.target.set(0,tot/2,0);cam.position.copy(ctl.target).addScaledVector(dir,ext*(st.fur?2.45:2.1)+3);fit();showItem()}}

// ---------- 장면 다시 그리기
let meshes=[],fz=null,anim=null;
function rebuild(){
  const isItem=st.scene==='item';back.visible=!isItem;ground.visible=isItem;document.getElementById('itemBox').hidden=!isItem;
  if(isItem){group.rotation.set(0,0,0);if(IT.data&&IT.data.done)showItem();else startItem();return}
  meshes.forEach(m=>{m.geometry.dispose()});while(group.children.length)group.remove(group.children[0]);meshes=[];
  const R=(st.scene==='knit'?.185:st.scene==='chain'?.17:.34)*st.thick*(st.preset==='mohair'?.8:1);
  const paths=st.scene==='knit'?knitRows(R):st.scene==='chain'?chainPath(R):strandPath(R);
  const mat=yarnMat(R);
  paths.forEach(p=>{const g=buildYarn(p,R),m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;group.add(m);meshes.push(m)});
  fz=fuzzLines(meshes.map(m=>m.geometry));if(fz)group.add(fz);
  group.rotation.set(st.scene==='strand'?0:-.12,0,0);
}
function fit(){const k=Math.max(1,1.45/cam.aspect);cam.position.sub(ctl.target).multiplyScalar(k).add(ctl.target);ctl.update()}
function frameCam(){if(st.scene==='item'){const b=IT.kind==='bag';ctl.target.set(0,b?3.2:0,0);cam.position.set(0,b?9:11,b?21:13.5);fit();return}const d=st.scene==='knit'?17:st.scene==='chain'?15:12;cam.position.set(st.scene==='knit'?2.5:1.5,st.scene==='knit'?1.5:2.5,d);ctl.target.set(0,0,0);fit()}
function playDraw(){ if(st.scene==='item'){startItem();return} if(anim)cancelAnimationFrame(anim);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(fz)fz.visible=false;const totals=meshes.map(m=>m.geometry.index.count),sum=totals.reduce((a,b)=>a+b,0);meshes.forEach(m=>m.geometry.setDrawRange(0,0));
  const t0=performance.now(),dur=st.scene==='knit'?6000:3500;
  (function step(now){let k=Math.min(1,(now-t0)/dur)*sum;meshes.forEach((m,i)=>{const pr=m.geometry.userData.perRing,c=Math.max(0,Math.min(totals[i],k));m.geometry.setDrawRange(0,Math.floor(c/pr)*pr);k-=totals[i]});
    if(now-t0<dur)anim=requestAnimationFrame(step);else{meshes.forEach(m=>m.geometry.setDrawRange(0,Infinity));if(fz)fz.visible=true;anim=null}})(t0)}

// ---------- 조작
const PRE={cotton:{plies:4,twist:1,fuzz:.05,depth:.3,braid:false,rough:.8},wool:{plies:3,twist:.8,fuzz:.4,depth:.26,braid:false,rough:.96},
  mohair:{plies:2,twist:.5,fuzz:1,depth:.16,braid:false,rough:1},cord:{plies:8,twist:1.3,fuzz:0,depth:.2,braid:true,rough:.68},
  fur:{plies:2,twist:.6,fuzz:1,depth:.12,braid:false,rough:1},metal:{plies:3,twist:1.5,fuzz:0,depth:.3,braid:false,rough:.3}};
const $=id=>document.getElementById(id);
function syncUI(){$('s-ply').value=st.plies;$('s-twist').value=st.twist;$('s-fuzz').value=st.fuzz;$('s-thick').value=st.thick;
  $('o-ply').textContent=st.plies;$('o-twist').textContent=(+st.twist).toFixed(1);$('o-fuzz').textContent=(+st.fuzz).toFixed(2);$('o-thick').textContent=(+st.thick).toFixed(1)}
let rt=null;function later(){clearTimeout(rt);rt=setTimeout(rebuild,60)}
document.querySelectorAll('#presets .chip').forEach(b=>b.addEventListener('click',()=>{st.preset=b.dataset.p;Object.assign(st,PRE[st.preset]);st.fur=st.preset==='fur';st.metal=st.preset==='metal'?.85:0;
  document.querySelectorAll('#presets .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));syncUI();rebuild()}));
[['s-thick','thick'],['s-ply','plies'],['s-twist','twist'],['s-fuzz','fuzz']].forEach(([id,k])=>$(id).addEventListener('input',e=>{st[k]=+e.target.value;syncUI();later()}));
const COLORS=[['아이보리','#EFE6D4'],['더스티 로즈','#D9A9A6'],['세이지','#A9B79C'],['웜그레이','#A39A90'],['머스터드','#D1A545'],['네이비','#3F4A63'],['차콜','#4A4541']];
COLORS.forEach(([name,hex],i)=>{const b=document.createElement('button');b.className='sw';b.style.background=hex;b.setAttribute('aria-label',name);b.title=name;b.setAttribute('aria-pressed',i===0);
  b.addEventListener('click',()=>{st.color=hex;document.querySelectorAll('#colors .sw').forEach(x=>x.setAttribute('aria-pressed',x===b));rebuild()});$('colors').append(b)});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{st.scene=b.dataset.scene;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));rebuild();frameCam()}));
$('play').addEventListener('click',playDraw);
document.querySelectorAll('#kinds .chip').forEach(b=>b.addEventListener('click',()=>{IT.kind=b.dataset.k;document.querySelectorAll('#kinds .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));startItem();frameCam()}));
document.querySelectorAll('#views .chip').forEach(b=>b.addEventListener('click',()=>{IT.view=b.dataset.v;document.querySelectorAll('#views .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));if(IT.data)showItem()}));
$('s-inc').addEventListener('input',e=>{IT.inc=+e.target.value;$('o-inc').textContent=IT.inc;startItem()});
[['s-ymm','ymm','o-ymm'],['s-hmm','hmm','o-hmm']].forEach(([id,k,o])=>$(id).addEventListener('input',e=>{IT[k]=+e.target.value;$(o).textContent=IT[k]+'mm';clearTimeout(rt);rt=setTimeout(()=>{startItem();frameCam()},120)}));
const pick=(sel,attr,fn)=>document.querySelectorAll(sel+' .chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll(sel+' .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset[attr])}));
pick('#shapes','s',v=>{IT.shape=v;startItem()});pick('#straps','t',v=>{IT.strap=v;if(IT.data&&IT.data.done){IT.data.done=false;IT.data.iter=149}});
pick('#stripes','b',v=>{IT.stripe=v==='1';$('colors2').hidden=!IT.stripe;if(IT.data&&IT.data.done)showItem()});
COLORS.forEach(([name,hex],i)=>{const b=document.createElement('button');b.className='sw sw2';b.style.background=hex;b.setAttribute('aria-label','둘째 색 '+name);b.title=name;b.setAttribute('aria-pressed',i===1);
  b.addEventListener('click',()=>{st.color2=hex;document.querySelectorAll('.sw2').forEach(x=>x.setAttribute('aria-pressed',x===b));if(IT.data&&IT.data.done)showItem()});$('colors2').append(b)});
function resize(){const w=cv.clientWidth,h=cv.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();syncUI();rebuild();frameCam();
(function loop(){if(st.scene==='item')tickItem();ctl.update();renderer.render(scene,cam);requestAnimationFrame(loop)})();
window.__yarn={st,IT,rebuild,frameCam};
})();
